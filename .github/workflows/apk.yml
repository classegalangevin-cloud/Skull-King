name: Compiler l'APK Android

# Se lance à la demande depuis l'onglet Actions du dépôt.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Construire l'application web
        run: npm run build

      - name: Créer le projet Android
        run: npx cap add android

      - name: Copier l'application dans le projet Android
        run: npx cap sync android

      - name: Générer les icônes et l'écran de lancement
        run: npx capacitor-assets generate --android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: skull-king-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
